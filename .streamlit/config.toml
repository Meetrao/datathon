[theme]
base = "light"
primaryColor = "#0284C7"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 2048
maxMessageSize = 1024
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
